[package]
name = "zlink"
version = "0.5.0"
description = "Async Varlink API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["tokio", "service", "proxy", "tracing"]
std = []
tokio = ["dep:zlink-tokio", "std"]
smol = ["dep:zlink-smol", "std"]
server = ["zlink-tokio?/server", "zlink-smol?/server"]
proxy = ["zlink-tokio?/proxy", "zlink-smol?/proxy"]
service = ["server", "introspection", "zlink-tokio?/service", "zlink-smol?/service"]
idl = ["zlink-tokio?/idl", "zlink-smol?/idl"]
idl-parse = ["zlink-tokio?/idl-parse", "zlink-smol?/idl-parse"]
introspection = ["zlink-tokio?/introspection", "zlink-smol?/introspection"]
tracing = ["zlink-tokio?/tracing", "zlink-smol?/tracing"]
defmt = ["zlink-tokio?/defmt", "zlink-smol?/defmt"]

[dependencies]
zlink-tokio = { path = "../zlink-tokio", version = "=0.5.0", default-features = false, optional = true }
zlink-smol = { path = "../zlink-smol", version = "=0.5.0", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.44.0", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
    "fs",
    "net",
] }
serde = { version = "1.0.218", default-features = false, features = ["derive"] }
serde_repr = "0.1.20"
serde-prefix-all = "0.1.0"
test-log = { version = "0.2.17", default-features = false, features = [
    "trace",
    "color",
] }
futures-util = { version = "0.3.31", default-features = false, features = [
    "async-await",
] }
clap = { version = "4.0", features = ["derive"] }
colored = "3.0"
tempfile = "3.8"
serde_json = "1.0"
tracing-subscriber = "0.3.19"
rustix = { version = "1.1.2", features = ["process"] }
rand = "0.9"

[[example]]
name = "varlink-inspect"
required-features = ["introspection", "idl-parse", "tokio"]

[[example]]
name = "resolved"
required-features = ["proxy", "tokio"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
