[package]
name = "zlink"
version = "0.9.0"
description = "Async Varlink API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["tokio", "service", "proxy", "tracing"]
tokio = ["dep:zlink-tokio"]
smol = ["dep:zlink-smol"]
zruntime = ["dep:zlink-rt"]
server = [
    "zlink-core/server",
    "zlink-tokio?/server",
    "zlink-smol?/server",
    "zlink-rt?/server",
]
proxy = [
    "zlink-core/proxy",
    "zlink-tokio?/proxy",
    "zlink-smol?/proxy",
    "zlink-rt?/proxy",
]
service = [
    "server",
    "introspection",
    "zlink-core/service",
    "zlink-tokio?/service",
    "zlink-smol?/service",
    "zlink-rt?/service",
]
idl = ["zlink-core/idl", "zlink-tokio?/idl", "zlink-smol?/idl", "zlink-rt?/idl"]
idl-parse = [
    "zlink-core/idl-parse",
    "zlink-tokio?/idl-parse",
    "zlink-smol?/idl-parse",
    "zlink-rt?/idl-parse",
]
introspection = [
    "zlink-core/introspection",
    "zlink-tokio?/introspection",
    "zlink-smol?/introspection",
    "zlink-rt?/introspection",
]
tracing = [
    "zlink-core/tracing",
    "zlink-tokio?/tracing",
    "zlink-smol?/tracing",
    "zlink-rt?/tracing",
]
defmt = [
    "zlink-core/defmt",
    "zlink-tokio?/defmt",
    "zlink-smol?/defmt",
    "zlink-rt?/defmt",
]
# The hand-over of a connection to another process, such as the next instance of a service that
# restarts, through zoter, on Linux: elsewhere, it builds nothing.
handover = ["zlink-core/handover"]

[dependencies]
zlink-core = { path = "../zlink-core", version = "=0.9.0", default-features = false }
zlink-tokio = { path = "../zlink-tokio", version = "=0.9.0", default-features = false, optional = true }
zlink-smol = { path = "../zlink-smol", version = "=0.9.0", default-features = false, optional = true }
zlink-rt = { path = "../zlink-rt", version = "=0.9.0", default-features = false, optional = true }

[dev-dependencies]
doc-comment = "0.3.3"
tokio = { version = "1.44.0", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
    "fs",
    "net",
] }
serde = { version = "1.0.218", default-features = false, features = ["derive"] }
serde_repr = "0.1.20"
serde-prefix-all = "0.1.0"
test-log = { version = "0.2.17", default-features = false, features = [
    "trace",
    "color",
] }
futures-util = { version = "0.3.31", default-features = false, features = [
    "async-await",
] }
clap = { version = "4.0", features = ["derive"] }
colored = "3.0"
tempfile = "3.8"
dirs = "6.0"
serde_json = "1.0"
tracing-subscriber = "0.3.19"
rustix = { version = "1.1.2", features = ["process"] }

[[example]]
name = "varlink-inspect"
required-features = ["introspection", "idl-parse", "tokio"]

[[example]]
name = "resolved"
required-features = ["proxy", "tokio"]

# The tests of the hand-over restart services through zoter's fake service manager.
[target.'cfg(target_os = "linux")'.dev-dependencies.zoter]
version = "0.1.0"
features = ["testing"]

# And take a connection over on a local zruntime runtime, from the git source of zlink-rt's.
[target.'cfg(target_os = "linux")'.dev-dependencies.zruntime]
git = "https://github.com/z-galaxy/zruntime"
branch = "main"
default-features = false
features = ["runtime"]

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
