[package]
name = "zlink-zruntime"
version = "0.8.0"
description = "zlink library for the zruntime runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["service", "proxy", "tracing"]
server = ["zlink-core/server"]
proxy = ["zlink-core/proxy"]
service = ["server", "introspection", "zlink-core/service"]
idl = ["zlink-core/idl"]
idl-parse = ["zlink-core/idl-parse"]
introspection = ["zlink-core/introspection"]
tracing = ["zlink-core/tracing", "zruntime/tracing"]
defmt = ["zlink-core/defmt"]

[dependencies]
zlink-core = { path = "../zlink-core", version = "=0.8.0", default-features = false, features = ["std"] }
# Taken from git, for API that zruntime has not released yet, until zlink is released.
zruntime = { git = "https://github.com/z-galaxy/zruntime", branch = "main", default-features = false, features = [
    "runtime",
    "helper",
    "unix",
] }

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
