[package]
name = "zlink-tokio"
version = "0.7.0"
description = "zlink library for the Tokio runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["service", "proxy", "tracing"]
server = ["zlink-core/server"]
proxy = ["zlink-core/proxy"]
service = ["server", "introspection", "zlink-core/service"]
idl = ["zlink-core/idl"]
idl-parse = ["zlink-core/idl-parse"]
introspection = ["zlink-core/introspection"]
tracing = ["zlink-core/tracing", "tokio/tracing"]
defmt = ["zlink-core/defmt"]

[dependencies]
zlink-core = { path = "../zlink-core", version = "=0.7.0", default-features = false, features = ["std"] }
tokio = { version = "1.44.0", features = ["net", "io-util"] }
futures-util = { version = "0.3.31", default-features = false, features = [
    "async-await",
    "alloc",
] }
tokio-stream = { version = "0.1.17", default-features = false, features = [
    "sync",
] }
pin-project-lite = "0.2"

[dev-dependencies]
tokio = { version = "1.44.0", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
    "fs",
] }
serde = { version = "1.0.218", default-features = false, features = ["derive"] }
serde_repr = "0.1.20"
test-log = { version = "0.2.17", default-features = false, features = [
    "trace",
    "color",
] }
tempfile = "3.14"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
