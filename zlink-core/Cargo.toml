[package]
name = "zlink-core"
version = "0.7.0"
description = "The core crate of the zlink project"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std", "server", "proxy", "tracing"]
std = ["dep:rustix", "dep:libc", "zlink-macros/std"]
server = []
proxy = ["zlink-macros/proxy"]
service = ["server", "zlink-macros/service", "introspection"]
# IDL and introspection support
idl = ["dep:zlink-idl"]
idl-parse = ["idl", "zlink-idl/parse", "zlink-macros/idl-parse"]
introspection = ["idl", "zlink-macros/introspection"]

[dependencies]
serde = { version = "1.0.218", default-features = false, features = ["derive", "alloc"] }
zlink-macros = { path = "../zlink-macros", version = "=0.7.0" }
zlink-idl = { path = "../zlink-idl", version = "=0.7.0", optional = true }
serde_json = { version = "1.0.139", default-features = false, features = ["alloc"] }
itoa = { version = "1.0", default-features = false }
ryu = { version = "1.0", default-features = false }
futures-util = { version = "0.3.31", default-features = false, features = [
    "async-await",
    "async-await-macro",
] }
tracing = { version = "0.1.41", default-features = false, optional = true }
defmt = { version = "1.0.1", default-features = false, optional = true }
pin-project-lite = "0.2.16"

# Optional dependencies for external type implementations
uuid = { version = "1.0", optional = true, default-features = false }
chrono = { version = "0.4", optional = true, default-features = false }
time = { version = "0.3", optional = true, default-features = false }
url = { version = "2.5", optional = true, default-features = false }
bytes = { version = "1.5", optional = true, default-features = false }
indexmap = { version = "2.2", optional = true }
rustix = { version = "1.1.2", default-features = false, features = [
    "net",
    "process",
    "std",
    "fs",
], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
doc-comment = "0.3.3"
serde = { version = "1.0.218", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.139" }
serde-prefix-all = "0.1.0"
test-log = { version = "0.2.17", default-features = false, features = [
    "trace",
    "color",
] }
tokio = { version = "1.44.0", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "test-util",
    "fs",
] }
criterion = { version = "4.0.4", package = "codspeed-criterion-compat", features = ["async_tokio"] }

[[bench]]
name = "benchmarks"
harness = false

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
