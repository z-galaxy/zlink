[package]
name = "zlink-names"
version = "0.8.0"
description = "Varlink names and their validation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.218", default-features = false, features = ["alloc"], optional = true }
winnow = { version = "0.7", default-features = false }
zcheapstr = { version = "1.2", default-features = false }

[dev-dependencies]
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
